# Supplementary current cash report inventory; source https://www.nseindia.com/all-reports
# Existing parsed cash families stay in report_catalog.yml. Non-daily products may be unavailable on a given date.
reports:
  cm_turnover:
    enabled: true
    parser: archive_only
    filename: "cm_turnover_{yyyymmdd}.bin"
