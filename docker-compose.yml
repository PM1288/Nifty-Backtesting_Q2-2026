services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketdata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.max=10000", "-c", "track_io_timing=on", "-c", "wal_compression=on", "-c", "checkpoint_timeout=15min", "-c", "checkpoint_completion_target=0.9", "-c", "max_wal_size=2GB", "-c", "min_wal_size=512MB", "-c", "max_connections=50"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  collector:
    build: .
    env_file:
      - .env
      - .env.collector.runtime
    environment:
      POSTGRES_MAX_CONNS: "3"
      POSTGRES_MIN_CONNS: "0"
      POSTGRES_MAX_CONN_IDLE_SECONDS: "10"
      POSTGRES_HEALTH_CHECK_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
      - ./samples/nifty100.sample.csv:/app/nifty100.csv:ro
      - ./docs/source/ind_nifty100list.csv:/app/nifty100_constituents.csv:ro
      - ./state:/app/state
    ports:
      - "${COLLECTOR_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  strategy:
    build: .
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNS: "2"
      POSTGRES_MIN_CONNS: "0"
      POSTGRES_MAX_CONN_IDLE_SECONDS: "10"
      POSTGRES_HEALTH_CHECK_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/strategy"]
    command: ["--config","/app/config.yaml"]
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  watchlist:
    build: .
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNS: "2"
      POSTGRES_MIN_CONNS: "0"
      POSTGRES_MAX_CONN_IDLE_SECONDS: "10"
      POSTGRES_HEALTH_CHECK_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/watchlist"]
    command: ["--config","/app/config.yaml"]
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  rsi-willr-monitor:
    build: .
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNS: "2"
      POSTGRES_MIN_CONNS: "0"
      POSTGRES_MAX_CONN_IDLE_SECONDS: "10"
      POSTGRES_HEALTH_CHECK_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/rsiwillr"]
    command: ["--config","/app/config.yaml"]
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
       driver: json-file

  matomo-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:-change-me-matomo-root}
      MARIADB_DATABASE: ${MATOMO_DB_NAME:-matomo}
      MARIADB_USER: ${MATOMO_DB_USER:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:-change-me-matomo-db}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u${MATOMO_DB_USER:-matomo} -p${MATOMO_DB_PASSWORD:-change-me-matomo-db} --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  matomo:
    image: matomo:5-apache
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:-change-me-matomo-db}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME:-matomo}
      PHP_MEMORY_LIMIT: 256M
    depends_on:
      matomo-db:
        condition: service_healthy
    ports:
      - "19091:80"
    volumes:
      - matomo_data:/var/www/html
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  option-chain-watcher:
    build: ./services/option-chain-watcher
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NSE_OC_DB_MAX_CONNS: "2"
      NSE_OC_DB_IDLE_TIMEOUT_MS: "10000"
      NSE_OC_DB_CONNECTION_TIMEOUT_MS: "5000"
      NSE_OC_DB_MAX_LIFETIME_SECONDS: "1800"
      NSE_REFERER: https://www.nseindia.com/option-chain
      NSE_OC_RUN_MIGRATIONS_ON_START: ${NSE_OC_RUN_MIGRATIONS_ON_START:-0}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse_ingestor:
    build:
      context: ./services/nse_ingestor
    container_name: nse_ingestor
    env_file:
      - ./services/nse_ingestor/.env
    environment:
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/nse_ingestor/runtime/inbound:/data/inbound
      - ./services/nse_ingestor/runtime/staging:/data/staging
      - ./services/nse_ingestor/runtime/logs:/data/logs
      - ./services/nse_ingestor/ops:/app/ops:ro
    entrypoint: ["/bin/bash", "/app/ops/entrypoint.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  institutional-flow-ingest:
    build:
      context: ./services/institutional_flow_ingest
    profiles: ["institutional-flow"]
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      MIF_ROOT_DIR: /app
      MIF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIF_DATABASE_SCHEMA: ${MIF_DATABASE_SCHEMA:-institutional_flow}
      MIF_RETAIN_RAW_FILES: ${MIF_RETAIN_RAW_FILES:-false}
      MIF_RETAIN_CURATED_FILES: ${MIF_RETAIN_CURATED_FILES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/institutional_flow_ingest/raw:/app/raw
      - ./services/institutional_flow_ingest/staging:/app/staging
      - ./services/institutional_flow_ingest/curated:/app/curated
      - ./services/institutional_flow_ingest/logs:/app/logs
      - ./services/institutional_flow_ingest/run_reports:/app/run_reports
    command: ["python", "scripts/run_daily.py"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  institutional-flow-ingest-scheduler:
    build:
      context: ./services/institutional_flow_ingest
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      MIF_ROOT_DIR: /app
      MIF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIF_DATABASE_SCHEMA: ${MIF_DATABASE_SCHEMA:-institutional_flow}
      MIF_RETAIN_RAW_FILES: ${MIF_RETAIN_RAW_FILES:-false}
      MIF_RETAIN_CURATED_FILES: ${MIF_RETAIN_CURATED_FILES:-false}
      MIF_SCHEDULER_ENABLED: ${MIF_SCHEDULER_ENABLED:-1}
      MIF_SCHEDULER_RUN_ON_START: ${MIF_SCHEDULER_RUN_ON_START:-1}
      MIF_SCHEDULER_TIME: ${MIF_SCHEDULER_TIME:-08:10}
      MIF_SCHEDULER_LATE_ARRIVAL_WINDOW: ${MIF_SCHEDULER_LATE_ARRIVAL_WINDOW:-5}
      MIF_SCHEDULER_SLEEP_CAP_SECONDS: ${MIF_SCHEDULER_SLEEP_CAP_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/institutional_flow_ingest/raw:/app/raw
      - ./services/institutional_flow_ingest/staging:/app/staging
      - ./services/institutional_flow_ingest/curated:/app/curated
      - ./services/institutional_flow_ingest/logs:/app/logs
      - ./services/institutional_flow_ingest/run_reports:/app/run_reports
    command: ["python", "scripts/scheduler.py"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nse-analytics-worker:
    build:
      context: ./services/nse_analytics_worker
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_DIR: /app/runtime/logs
      POLL_SECONDS: ${NSE_ANALYTICS_POLL_SECONDS:-1800}
      REBUILD_WINDOW_DAYS: ${NSE_ANALYTICS_REBUILD_WINDOW_DAYS:-120}
      FEATURE_RETENTION_DAYS: ${NSE_ANALYTICS_FEATURE_RETENTION_DAYS:-1825}
      SUMMARY_RETENTION_DAYS: ${NSE_ANALYTICS_SUMMARY_RETENTION_DAYS:-3650}
      LOG_RETENTION_DAYS: ${NSE_ANALYTICS_LOG_RETENTION_DAYS:-365}
      SNAPSHOT_REFRESH_URL: ${N50_SNAPSHOT_REFRESH_URL:-http://n50-dashboard:18184/internal/snapshots/refresh}
      SNAPSHOT_REFRESH_TOKEN: ${N50_SNAPSHOT_REFRESH_TOKEN:-}
      SNAPSHOT_REFRESH_TIMEOUT_SECONDS: ${N50_SNAPSHOT_REFRESH_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      nse_ingestor:
        condition: service_started
    volumes:
      - ./services/nse_analytics_worker/runtime/logs:/app/runtime/logs
      - ./services/nse_analytics_worker/ops:/app/ops:ro
    entrypoint: ["/bin/bash", "/app/ops/entrypoint.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse-orchestrator:
    build:
      context: .
      dockerfile: ./services/nse_orchestration_exports/docker/Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NSE_EXPORT_DB_POOL_MIN_SIZE: "1"
      NSE_EXPORT_DB_POOL_MAX_SIZE: "4"
      NSE_EXPORT_DB_POOL_TIMEOUT_SECONDS: "10"
      NSE_EXPORT_DB_POOL_MAX_IDLE_SECONDS: "30"
      EXPORT_ROOT: /var/lib/nse/exports
      INSTALL_SQL_ON_START: ${NSE_ORCHESTRATION_INSTALL_SQL_ON_START:-0}
    command: ["python", "-m", "nse_orchestration_exports.scheduler_main"]
    depends_on:
      postgres:
        condition: service_healthy
      nse_ingestor:
        condition: service_started
      nse-analytics-worker:
        condition: service_started
    volumes:
      - ./services/nse_orchestration_exports/runtime/exports:/var/lib/nse/exports
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse-export-api:
    build:
      context: .
      dockerfile: ./services/nse_orchestration_exports/docker/Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NSE_EXPORT_DB_POOL_MIN_SIZE: "1"
      NSE_EXPORT_DB_POOL_MAX_SIZE: "4"
      NSE_EXPORT_DB_POOL_TIMEOUT_SECONDS: "10"
      NSE_EXPORT_DB_POOL_MAX_IDLE_SECONDS: "30"
      EXPORT_ROOT: /var/lib/nse/exports
      INSTALL_SQL_ON_START: ${NSE_ORCHESTRATION_INSTALL_SQL_ON_START:-0}
    command: ["python", "-m", "nse_orchestration_exports.api_main"]
    depends_on:
      postgres:
        condition: service_healthy
      nse-orchestrator:
        condition: service_started
    volumes:
      - ./services/nse_orchestration_exports/runtime/exports:/var/lib/nse/exports
    ports:
      - "8091:8091"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse-intraday-api:
    build:
      context: .
      dockerfile: ./services/nse_intraday_intelligence/docker/Dockerfile
    env_file: .env
    environment:
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NSE_INTRADAY_DB_POOL_MIN_SIZE: "1"
      NSE_INTRADAY_DB_POOL_MAX_SIZE: "4"
      NSE_INTRADAY_DB_POOL_TIMEOUT_SECONDS: "10"
      NSE_INTRADAY_DB_POOL_MAX_IDLE_SECONDS: "30"
      TIMEZONE: Asia/Kolkata
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: "8092"
      DEFAULT_INDEX_CODE: NIFTY 50
      EXPORT_ROOT: /var/lib/nse/intraday_exports
      INSTALL_SQL_ON_START: ${NSE_INTRADAY_INSTALL_SQL_ON_START:-0}
      RAW_RETENTION_DAYS: ${NSE_INTRADAY_RAW_RETENTION_DAYS:-31}
      MINUTE_RETENTION_DAYS: ${NSE_INTRADAY_MINUTE_RETENTION_DAYS:-31}
      FEATURE_RETENTION_DAYS: ${NSE_INTRADAY_FEATURE_RETENTION_DAYS:-730}
      SNAPSHOT_RETENTION_DAYS: ${NSE_INTRADAY_SNAPSHOT_RETENTION_DAYS:-45}
      OPS_RUN_RETENTION_DAYS: ${NSE_INTRADAY_OPS_RUN_RETENTION_DAYS:-365}
      CRON_SYNC_RAW: ${NSE_INTRADAY_CRON_SYNC_RAW:-*/1 9-15 * * 1-5}
      CRON_REFRESH_FEATURES: ${NSE_INTRADAY_CRON_REFRESH_FEATURES:-*/1 9-15 * * 1-5}
      CRON_REFRESH_DASHBOARD: ${NSE_INTRADAY_CRON_REFRESH_DASHBOARD:-*/1 9-15 * * 1-5}
      CRON_REFRESH_WATCHLISTS: ${NSE_INTRADAY_CRON_REFRESH_WATCHLISTS:-*/2 9-15 * * 1-5}
      CRON_RUN_QUALITY: ${NSE_INTRADAY_CRON_RUN_QUALITY:-*/5 9-15 * * 1-5}
      CRON_FINALIZE_SESSION: ${NSE_INTRADAY_CRON_FINALIZE_SESSION:-40 15 * * 1-5}
      CRON_RETENTION: ${NSE_INTRADAY_CRON_RETENTION:-25 2 * * *}
      CRON_BACKFILL_HISTORY: ${NSE_INTRADAY_CRON_BACKFILL_HISTORY:-20 3 * * 6}
      JOB_CMD_SYNC_RAW: python -m nse_intraday_intelligence.manual_jobs sync-raw
      JOB_CMD_REFRESH_FEATURES: python -m nse_intraday_intelligence.manual_jobs refresh-features
      JOB_CMD_REFRESH_DASHBOARD: python -m nse_intraday_intelligence.manual_jobs refresh-dashboard
      JOB_CMD_REFRESH_WATCHLISTS: python -m nse_intraday_intelligence.manual_jobs refresh-watchlists
      JOB_CMD_RUN_QUALITY: python -m nse_intraday_intelligence.manual_jobs run-quality-checks
      JOB_CMD_FINALIZE_SESSION: python -m nse_intraday_intelligence.manual_jobs finalize-session
      JOB_CMD_RETENTION: python -m nse_intraday_intelligence.manual_jobs retention
      JOB_CMD_BACKFILL_HISTORY: python -m nse_intraday_intelligence.manual_jobs backfill-history --days 90
    command: ["python", "-m", "nse_intraday_intelligence.api_main"]
    depends_on:
      postgres:
        condition: service_healthy
      nse-orchestrator:
        condition: service_started
    volumes:
      - ./services/nse_intraday_intelligence/runtime/exports:/var/lib/nse/intraday_exports
    ports:
      - "8092:8092"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse-intraday-scheduler:
    build:
      context: .
      dockerfile: ./services/nse_intraday_intelligence/docker/Dockerfile
    env_file: .env
    environment:
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NSE_INTRADAY_DB_POOL_MIN_SIZE: "1"
      NSE_INTRADAY_DB_POOL_MAX_SIZE: "4"
      NSE_INTRADAY_DB_POOL_TIMEOUT_SECONDS: "10"
      NSE_INTRADAY_DB_POOL_MAX_IDLE_SECONDS: "30"
      TIMEZONE: Asia/Kolkata
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: "8092"
      DEFAULT_INDEX_CODE: NIFTY 50
      EXPORT_ROOT: /var/lib/nse/intraday_exports
      INSTALL_SQL_ON_START: ${NSE_INTRADAY_INSTALL_SQL_ON_START:-0}
      RAW_RETENTION_DAYS: ${NSE_INTRADAY_RAW_RETENTION_DAYS:-31}
      MINUTE_RETENTION_DAYS: ${NSE_INTRADAY_MINUTE_RETENTION_DAYS:-31}
      FEATURE_RETENTION_DAYS: ${NSE_INTRADAY_FEATURE_RETENTION_DAYS:-730}
      SNAPSHOT_RETENTION_DAYS: ${NSE_INTRADAY_SNAPSHOT_RETENTION_DAYS:-45}
      OPS_RUN_RETENTION_DAYS: ${NSE_INTRADAY_OPS_RUN_RETENTION_DAYS:-365}
      CRON_SYNC_RAW: ${NSE_INTRADAY_CRON_SYNC_RAW:-*/1 9-15 * * 1-5}
      CRON_REFRESH_FEATURES: ${NSE_INTRADAY_CRON_REFRESH_FEATURES:-*/1 9-15 * * 1-5}
      CRON_REFRESH_DASHBOARD: ${NSE_INTRADAY_CRON_REFRESH_DASHBOARD:-*/1 9-15 * * 1-5}
      CRON_REFRESH_WATCHLISTS: ${NSE_INTRADAY_CRON_REFRESH_WATCHLISTS:-*/2 9-15 * * 1-5}
      CRON_RUN_QUALITY: ${NSE_INTRADAY_CRON_RUN_QUALITY:-*/5 9-15 * * 1-5}
      CRON_FINALIZE_SESSION: ${NSE_INTRADAY_CRON_FINALIZE_SESSION:-40 15 * * 1-5}
      CRON_RETENTION: ${NSE_INTRADAY_CRON_RETENTION:-25 2 * * *}
      CRON_BACKFILL_HISTORY: ${NSE_INTRADAY_CRON_BACKFILL_HISTORY:-20 3 * * 6}
      JOB_CMD_SYNC_RAW: python -m nse_intraday_intelligence.manual_jobs sync-raw
      JOB_CMD_REFRESH_FEATURES: python -m nse_intraday_intelligence.manual_jobs refresh-features
      JOB_CMD_REFRESH_DASHBOARD: python -m nse_intraday_intelligence.manual_jobs refresh-dashboard
      JOB_CMD_REFRESH_WATCHLISTS: python -m nse_intraday_intelligence.manual_jobs refresh-watchlists
      JOB_CMD_RUN_QUALITY: python -m nse_intraday_intelligence.manual_jobs run-quality-checks
      JOB_CMD_FINALIZE_SESSION: python -m nse_intraday_intelligence.manual_jobs finalize-session
      JOB_CMD_RETENTION: python -m nse_intraday_intelligence.manual_jobs retention
      JOB_CMD_BACKFILL_HISTORY: python -m nse_intraday_intelligence.manual_jobs backfill-history --days 90
    command: ["python", "-m", "nse_intraday_intelligence.scheduler_main"]
    depends_on:
      postgres:
        condition: service_healthy
      nse-intraday-api:
        condition: service_started
    volumes:
      - ./services/nse_intraday_intelligence/runtime/exports:/var/lib/nse/intraday_exports
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nse-reco-api:
    build:
      context: ./services/nse_reco_state_engine
    env_file: .env
