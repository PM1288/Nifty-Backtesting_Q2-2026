[project]
name = "oiis-live"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "psycopg[binary,pool]==3.2.9",
  "xlsxwriter==3.2.9",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.7"]

[project.scripts]
oiis-live = "oiis_live.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
