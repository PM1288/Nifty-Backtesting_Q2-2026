      AUTH_ALLOWED_ORIGINS: ${N50_STAGE_AUTH_ALLOWED_ORIGINS:-https://stage.nifty50today.co.in,https://n50test.digii4.co.in,http://localhost:19090}
      REDIS_URL: ${N50_STAGE_REDIS_URL:-redis://redis:6379/1}
      FEEDBACK_WEBHOOK_URL: ${N50_FEEDBACK_WEBHOOK_URL:-}
      FEEDBACK_SIGNING_SECRET: ${N50_FEEDBACK_SIGNING_SECRET:-}
      N50_DISCORD_STREAM_ENABLED: ${N50_STAGE_DISCORD_STREAM_ENABLED:-0}
      N50_DISCORD_STREAM_SCHEDULER_ENABLED: "0"
      N50_DISCORD_STREAM_SHADOW_MODE: ${N50_STAGE_DISCORD_STREAM_SHADOW_MODE:-1}
