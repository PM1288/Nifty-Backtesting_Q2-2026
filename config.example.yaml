smartapi:
  api_key: "CHANGE_ME_SMARTAPI_API_KEY"
  client_code: "CHANGE_ME_SMARTAPI_CLIENT_CODE"
  password: "CHANGE_ME_SMARTAPI_PASSWORD" # legacy field; SmartAPI now expects your account MPIN here
  mpin: ""
  totp_secret: "CHANGE_ME_SMARTAPI_TOTP_SECRET" # base32 seed or current 6-digit code
  totp_code: ""
  access_token: ""
  feed_token: ""
  rest_base_url: "https://apiconnect.angelone.in"
  ws_url: "wss://smartapisocket.angelone.in/smart-stream"
  disable_live_orders: true
postgres:
  host: "postgres"
  port: 5432
  user: "trader"
  password: "CHANGE_ME_POSTGRES_PASSWORD"
  database: "tradingdb"
  sslmode: "disable"
  schema: "public"
  app_name: "nifty250_collector"
  connect_timeout_seconds: 10
  max_conns: 10
  min_conns: 2
  max_conn_idle_seconds: 10
  health_check_seconds: 15
  max_conn_lifetime_minutes: 30
  slow_query_ms: 250
runtime:
  timezone: "Asia/Kolkata"
  log_level: "info"
  log_json: true
  service_name: "smartapi-collector"
  service_version: "dev"
  http_timeout_seconds: 15
  flush_seconds: 2
  trading_start: "09:15"
  trading_end: "15:40"
  weekend_pull_last_working_day: true
stock_webhook:
  enabled: false
  url: "" # prefer STOCK_WEBHOOK_URL from an ignored runtime env file
  timeout_seconds: 5
  max_retries: 2
  retry_backoff_milliseconds: 500
files:
  symbols_csv_path: "/app/nifty250.csv"
  constituents_csv_path: "/app/nifty250_constituents.csv"
  instrument_cache_path: "/app/state/OpenAPIScripMaster.json"
universe:
  equities_exchange: "NSE"
  derivatives_exchange: "NFO"
  include_indices: ["NIFTY50","BANKNIFTY","FINNIFTY","MIDCPNIFTY","NIFTY100","NIFTY200","NIFTY500","INDIAVIX","SENSEX"]
  index_tokens:
    NIFTY50: "99926000"
    BANKNIFTY: "99926009"
    FINNIFTY: "99926037"
    MIDCPNIFTY: "99926074"
    NIFTY100: "99926012"
    NIFTY200: "99926033"
    NIFTY500: "99926004"
    INDIAVIX: "99926017"
    SENSEX: "99919000"
  index_exchanges:
    SENSEX: "BSE"
  fno_current_month_only: true
  futures:
    enable_stock_futures: true
    enable_index_futures: true
    expiry_rank: 0
  options:
    enable_index_options: true
    enable_stock_options: true
    index_underlyings: ["NIFTY50"]
    stock_underlyings_max: 250
    expiry_rank_index: 0
    expiry_rank_stock: 0
    strikes_each_side: 40
    strike_refresh_minutes: 5
    atm_shift_rebuild_steps: 2
ws:
  mode_equities: "LTP"
  mode_indices: "LTP"
  mode_futures: "SNAPQUOTE"
  mode_options: "SNAPQUOTE"
  max_reconnect_backoff_seconds: 30
  max_connections: 3
  max_tokens_per_connection: 1000
  insecure_skip_verify: false
  enable_depth_snapshots: true
  depth_snapshot_interval_seconds: 5
  depth_snapshot_kinds: ["EQUITY","INDEX","FUT","OPTIDX","OPTSTK"]
health:
  enable_http: true
  listen_addr: "0.0.0.0:8080"
archive:
  enable: true
  enable_market_ticks: true
  tick_sample_milliseconds: 1000
  tick_buffer_size: 65536
  tick_batch_size: 2000
  enable_instrument_snapshots: true
  enable_option_chain_snapshots: true
  option_chain_interval_seconds: 300
  option_chain_snapshot_timeout_seconds: 45
  option_chain_snapshot_max_attempts: 3
  option_chain_retry_base_seconds: 5
  option_chain_stale_after_seconds: 900
