<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <!-- Brand gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12B8C2"></stop>
      <stop offset="45%" stop-color="#2DA3DA"></stop>
      <stop offset="75%" stop-color="#2563EB"></stop>
      <stop offset="100%" stop-color="#1E3A8A"></stop>
    </linearGradient>

    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"></stop>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"></stop>
    </radialGradient>

    <!-- Blueprint grid -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0M80 80V0" stroke="rgba(255,255,255,0.045)" stroke-width="1"></path>
      <path d="M0 40H80M40 0V80" stroke="rgba(255,255,255,0.03)" stroke-width="1"></path>
    </pattern>

    <!-- Circuit traces -->
    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"></stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#bgGrad)"></rect>
  <rect width="3840" height="2160" fill="url(#vignette)"></rect>
  <rect width="3840" height="2160" fill="url(#grid)"></rect>

  <!-- Engineering arcs/gears -->
  <g fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6">
    <circle cx="700" cy="400" r="280"></circle>
    <circle cx="700" cy="400" r="360" stroke-width="4" stroke="rgba(255,255,255,0.04)"></circle>
    <path d="M300 1700 A900 900 0 0 1 1900 1500"></path>
    <path d="M2200 300 A1200 1200 0 0 1 3600 1200"></path>
  </g>

  <!-- Circuit traces -->
  <g stroke="url(#traceGrad)" stroke-width="3" fill="none" opacity="0.6">
    <path d="M200 600 H1000 Q1100 600 1150 650 T1300 700 H2200"></path>
    <path d="M400 900 H1400 Q1500 900 1550 950 T1700 1000 H3200"></path>
    <path d="M300 1300 H1100 Q1200 1300 1250 1350 T1400 1400 H2800"></path>
  </g>

  <!-- Connection nodes -->
  <g fill="rgba(255,255,255,0.25)">
    <circle cx="1000" cy="600" r="6"></circle>
    <circle cx="1300" cy="700" r="6"></circle>
    <circle cx="1400" cy="900" r="6"></circle>
    <circle cx="1700" cy="1000" r="6"></circle>
    <circle cx="1100" cy="1300" r="6"></circle>
    </g></svg>