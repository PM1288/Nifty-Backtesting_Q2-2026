[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-stratlab"
version = "0.1.0"
description = "Point-in-time NIFTY equity and long-option research/backtesting reference implementation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Internal Quantitative Engineering"}]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "jsonschema>=4.23,<5"]

[project.scripts]
nifty-stratlab = "nifty_stratlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires PostgreSQL or external files",
  "slow: long-running test",
]
