[project]
name = "market-status-notifications"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.8"]

[project.scripts]
market-status-scheduler = "market_status.scheduler:main"
market-status-worker = "market_status.worker:main"
market-status-delivery = "market_status.delivery:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
