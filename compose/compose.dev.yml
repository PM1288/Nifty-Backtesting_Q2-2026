      N50_DISCORD_STREAM_INTERVAL_SECONDS: ${N50_STAGE_DISCORD_STREAM_INTERVAL_SECONDS:-1800}
      N50_DISCORD_STREAM_COOLDOWN_MINUTES: ${N50_STAGE_DISCORD_STREAM_COOLDOWN_MINUTES:-180}
      N50_DISCORD_WEBHOOK_URL_TEST: ${N50_STAGE_DISCORD_WEBHOOK_URL_TEST:-}
      N50_DISCORD_WEBHOOK_URL_PROD: ${N50_STAGE_DISCORD_WEBHOOK_URL_PROD:-}
      N50_DISCORD_THREAD_ID_TEST: ${N50_STAGE_DISCORD_THREAD_ID_TEST:-}
      N50_DISCORD_THREAD_ID_PROD: ${N50_STAGE_DISCORD_THREAD_ID_PROD:-}
      N50_DISCORD_THREAD_ID_MARKET: ${N50_STAGE_DISCORD_THREAD_ID_MARKET:-}
      SESSION_COOKIE_NAME: ${N50_STAGE_SESSION_COOKIE_NAME:-n50-stage-session}
      SESSION_COOKIE_NAME_INSECURE: ${N50_STAGE_SESSION_COOKIE_NAME_INSECURE:-n50-stage-session}
      SESSION_COOKIE_PATH: ${N50_STAGE_SESSION_COOKIE_PATH:-/n50-stage}
      NSE_RECO_API_BASE_URL: http://nse-reco-api:8010
      SUPPORTING_METRICS_API_BASE_URL: http://market-data-gateway:8000
      NIFTY100_DISCLOSURES_API_BASE_URL: http://nifty100-disclosures-api:8000
      NIFTY100_DISCLOSURES_TIMEOUT_MS: ${NIFTY100_DISCLOSURES_TIMEOUT_MS:-600000}
      NSE_FII_REPORTS_API_BASE_URL: http://nse-fii-reports-api:8000
      NSE_FII_REPORTS_TIMEOUT_MS: ${NSE_FII_REPORTS_TIMEOUT_MS:-600000}
      SNAPSHOT_REFRESH_TOKEN: ${N50_SNAPSHOT_REFRESH_TOKEN:-}
      MATOMO_PROXY_BASE_URL: ${N50_MATOMO_PROXY_BASE_URL:-http://matomo:80}
      N50_API_ALLOW_RUNTIME_DDL: ${N50_API_ALLOW_RUNTIME_DDL:-0}
      N50_API_ALLOW_RUNTIME_PERF_DDL: ${N50_API_ALLOW_RUNTIME_PERF_DDL:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nse-reco-api:
        condition: service_started
      market-data-gateway:
        condition: service_started
      nifty100-disclosures-api:
        condition: service_started
      nse-fii-reports-api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  n50-discord-stream-dispatcher-stage:
    image: trading-stack-n50-dashboard-stage:latest
    env_file:
      - ../.env
      - ./env/dev.env
    environment:
      TZ: "Asia/Kolkata"
      N50_API_DB_CONNECTION_LIMIT: ${N50_API_DB_CONNECTION_LIMIT:-2}
      N50_API_DB_POOL_TIMEOUT: ${N50_API_DB_POOL_TIMEOUT:-5}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=${POSTGRES_SCHEMA:-public}&connection_limit=${N50_API_DB_CONNECTION_LIMIT:-2}&pool_timeout=${N50_API_DB_POOL_TIMEOUT:-5}
      REDIS_URL: ${N50_STAGE_REDIS_URL:-redis://redis:6379/1}
      N50_DISCORD_STREAM_ENABLED: ${N50_STAGE_DISCORD_STREAM_ENABLED:-0}
      N50_DISCORD_STREAM_SCHEDULER_ENABLED: "1"
      N50_DISCORD_STREAM_SHADOW_MODE: ${N50_STAGE_DISCORD_STREAM_SHADOW_MODE:-1}
      N50_DISCORD_STREAM_USE_WAIT: ${N50_STAGE_DISCORD_STREAM_USE_WAIT:-1}
      N50_DISCORD_STREAM_INTERVAL_SECONDS: ${N50_STAGE_DISCORD_STREAM_INTERVAL_SECONDS:-1800}
      N50_DISCORD_STREAM_COOLDOWN_MINUTES: ${N50_STAGE_DISCORD_STREAM_COOLDOWN_MINUTES:-180}
      N50_DISCORD_WEBHOOK_URL_TEST: ${N50_STAGE_DISCORD_WEBHOOK_URL_TEST:-}
      N50_DISCORD_WEBHOOK_URL_PROD: ${N50_STAGE_DISCORD_WEBHOOK_URL_PROD:-}
      N50_DISCORD_THREAD_ID_TEST: ${N50_STAGE_DISCORD_THREAD_ID_TEST:-}
      N50_DISCORD_THREAD_ID_PROD: ${N50_STAGE_DISCORD_THREAD_ID_PROD:-}
      N50_DISCORD_THREAD_ID_MARKET: ${N50_STAGE_DISCORD_THREAD_ID_MARKET:-}
      NSE_RECO_API_BASE_URL: http://nse-reco-api:8010
      SUPPORTING_METRICS_API_BASE_URL: http://market-data-gateway:8000
      NIFTY100_DISCLOSURES_API_BASE_URL: http://nifty100-disclosures-api:8000
      NIFTY100_DISCLOSURES_TIMEOUT_MS: ${NIFTY100_DISCLOSURES_TIMEOUT_MS:-600000}
      NSE_FII_REPORTS_API_BASE_URL: http://nse-fii-reports-api:8000
      NSE_FII_REPORTS_TIMEOUT_MS: ${NSE_FII_REPORTS_TIMEOUT_MS:-600000}
      SNAPSHOT_REFRESH_TOKEN: ${N50_SNAPSHOT_REFRESH_TOKEN:-}
      N50_API_ALLOW_RUNTIME_DDL: ${N50_API_ALLOW_RUNTIME_DDL:-0}
      N50_API_ALLOW_RUNTIME_PERF_DDL: ${N50_API_ALLOW_RUNTIME_PERF_DDL:-0}
    command: ["node", "apps/api/dist/scripts/discordStreamDispatcher.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nse-reco-api:
        condition: service_started
      market-data-gateway:
        condition: service_started
      nifty100-disclosures-api:
        condition: service_started
      nse-fii-reports-api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  cdsl-fii-daily-ingest:
    image: trading-stack-cdsl-fii-daily-ingest:latest
    build:
      context: ../services/cdsl_fii_daily_ingest
    env_file:
      - ../.env
      - ./env/jobs.env
    environment:
      TZ: Asia/Kolkata
      CDSL_FII_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CDSL_FII_POSTGRES_SCHEMA: ${CDSL_FII_POSTGRES_SCHEMA:-institutional_flow}
      CDSL_FII_MORNING_TIME: ${CDSL_FII_MORNING_TIME:-08:00}
      CDSL_FII_EVENING_TIME: ${CDSL_FII_EVENING_TIME:-21:00}
      CDSL_FII_RUN_ON_START: ${CDSL_FII_RUN_ON_START:-1}
      CDSL_FII_SLEEP_CAP_SECONDS: ${CDSL_FII_SLEEP_CAP_SECONDS:-300}
      CDSL_FII_REQUEST_TIMEOUT_SECONDS: ${CDSL_FII_REQUEST_TIMEOUT_SECONDS:-30}
      CDSL_FII_LOG_LEVEL: ${CDSL_FII_LOG_LEVEL:-INFO}
      CDSL_FII_HOLIDAY_OVERRIDES: ${CDSL_FII_HOLIDAY_OVERRIDES:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/scheduler.py"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  nginx:
    image: nginx:alpine
    depends_on:
      - watchlist
      - rsi-willr-monitor
      - option-chain-watcher
      - matomo
      - n50-dashboard
      - n50-dashboard-stage
      - nse-export-api
      - nse-intraday-api
    ports:
      - "19090:19090"
    volumes:
      - ../compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../services/gateway:/usr/share/nginx/html:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

volumes:
  matomo_db_data:
  matomo_data:
