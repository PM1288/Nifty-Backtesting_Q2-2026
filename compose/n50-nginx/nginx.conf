# Deprecated historical ingress template.
# Source of truth is compose/nginx/nginx.conf, which is the file mounted by docker-compose on port 19090.
# Keep this file only as reference for older hardening experiments; do not update routing behavior here.
events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 20s;
  reset_timedout_connection on;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $request_method $is_invalid_method {
    default 1;
    GET 0;
    HEAD 0;
    POST 0;
    OPTIONS 0;
  }

  map $http_user_agent $is_scanner_ua {
    default 0;
    "~*(?:sqlmap|nikto|acunetix|masscan|nmap|zgrab|wpscan|dirbuster|gobuster|hydra|nessus|openvas|ahrefsbot|semrushbot|mj12bot|dotbot|bytespider|bingbot|yandexbot)" 1;
  }

  map $request_uri $is_probe_uri {
    default 0;
    "~*(?:/\\.env|/\\.git|/wp-admin|/wp-login\\.php|/xmlrpc\\.php|/phpmyadmin|/admin(?:/|$)|/cgi-bin|/etc/passwd|/\\.aws|/\\.svn|/\\.DS_Store)" 1;
  }

  map $query_string $is_attack_qs {
    default 0;
    "~*(?:\\.\\.(?:/|%2f|\\\\|%5c)|%2e%2e(?:/|%2f|\\\\|%5c)|<script|%3cscript|union(?:\\s|%20)+select|(?:\\bor\\b)(?:\\s|%20)+1=1|sleep\\(|benchmark\\(|load_file\\(|into(?:\\s|%20)+outfile)" 1;
  }

  limit_req_zone $binary_remote_addr zone=n50_web_limit:20m rate=900r/m;
  limit_req_zone $binary_remote_addr zone=n50_api_limit:20m rate=360r/m;
  limit_req_zone $binary_remote_addr zone=n50_auth_limit:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=n50_conn_limit:10m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream n50_app_upstream {
    zone n50_app_upstream 64k;
    server n50-dashboard:18184 resolve;
  }

  upstream n50_app_stage_upstream {
    zone n50_app_stage_upstream 64k;
    server n50-dashboard-stage:18184 resolve;
  }

  upstream nse_export_api_upstream {
    zone nse_export_api_upstream 64k;
    server nse-export-api:8091 resolve;
  }

  upstream nse_intraday_api_upstream {
    zone nse_intraday_api_upstream 64k;
    server nse-intraday-api:8092 resolve;
  }

  upstream option_chain_upstream {
    zone option_chain_upstream 64k;
    server option-chain-watcher:18182 resolve;
  }

  server {
    listen 19210;
    server_name localhost;

    if ($is_invalid_method) { return 405; }
    if ($is_scanner_ua) { return 403; }
    if ($is_probe_uri) { return 444; }
    if ($is_attack_qs) { return 403; }

    limit_conn n50_conn_limit 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location = /auth/session/login {
      limit_req zone=n50_auth_limit burst=15 nodelay;
      proxy_pass http://n50_app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Preserve host+port so backend origin checks match browser Origin header.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

  location = /n50-stage {
    return 301 /n50-stage/;
  }

  location = /n50-stage/ {
    proxy_http_version 1.1;
    proxy_pass http://n50_app_stage_upstream/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

    location ^~ /auth/ {
      limit_req zone=n50_api_limit burst=40 nodelay;
      proxy_pass http://n50_app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Preserve host+port so backend origin checks match browser Origin header.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location ^~ /v1/ {
      limit_req zone=n50_api_limit burst=120 nodelay;
      proxy_pass http://n50_app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Preserve host+port so backend origin checks match browser Origin header.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location ^~ /n50-stage/v1/ {
      limit_req zone=n50_api_limit burst=120 nodelay;
      proxy_pass http://n50_app_stage_upstream/v1/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location ^~ /api/v1/ {
      limit_req zone=n50_api_limit burst=120 nodelay;
      proxy_pass http://nse_export_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location ^~ /api/v1/intraday/ {
      limit_req zone=n50_api_limit burst=120 nodelay;
      proxy_pass http://nse_intraday_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location /option-chain/api/ {
      limit_req zone=n50_api_limit burst=120 nodelay;
      proxy_pass http://option_chain_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /option-chain/healthz {
      proxy_pass http://option_chain_upstream/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /option-chain/readyz {
      proxy_pass http://option_chain_upstream/readyz;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~* \.(?:php|asp|aspx|jsp|cgi)$ {
      return 403;
    }

    location / {
      limit_req zone=n50_web_limit burst=180 nodelay;
      proxy_pass http://n50_app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Preserve host+port so backend origin checks match browser Origin header.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      # Keep a single authoritative set of browser security headers at this edge.
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }

    location ^~ /n50-stage/ {
      limit_req zone=n50_web_limit burst=180 nodelay;
      proxy_pass http://n50_app_stage_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Permissions-Policy;
    }
  }
}
