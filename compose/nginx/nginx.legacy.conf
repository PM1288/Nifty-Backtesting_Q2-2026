events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream watchlist_upstream {
    zone watchlist_upstream 64k;
    server watchlist:8090 resolve;
  }

  upstream rsi_willr_upstream {
    zone rsi_willr_upstream 64k;
    server rsi-willr-monitor:8091 resolve;
  }

  server {
    listen 19090;
    server_name localhost _;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    location = / {
      return 302 /backend/healthz;
    }

    location ^~ /backend/ {
      proxy_pass http://watchlist_upstream;
    }

    location = /paper {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /paper/ {
      proxy_pass http://watchlist_upstream;
    }

    location = /watcher {
      proxy_pass http://watchlist_upstream;
    }

    location = /watcher/ {
      return 301 /watcher;
    }

    location ^~ /watcher/ {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /digii4/ {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /api/digii4/ {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /rsi-willr/ {
      proxy_pass http://rsi_willr_upstream/;
    }
  }
}
