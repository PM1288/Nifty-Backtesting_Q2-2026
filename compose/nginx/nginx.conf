events {}

http {
  # Canonical ingress for prod, stage, and local same-origin routes on port 19090.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 20s;
  reset_timedout_connection on;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $request_method $is_invalid_method {
    default 1;
    GET 0;
    HEAD 0;
    POST 0;
    OPTIONS 0;
  }

  map $http_user_agent $is_scanner_ua {
    default 0;
    "~*(?:sqlmap|nikto|acunetix|masscan|nmap|zgrab|wpscan|dirbuster|gobuster|hydra|nessus|openvas|ahrefsbot|semrushbot|mj12bot|dotbot|bytespider|bingbot|yandexbot)" 1;
  }

  map $request_uri $is_probe_uri {
    default 0;
    "~*(?:/\\.env|/\\.git|/wp-admin|/wp-login\\.php|/xmlrpc\\.php|/phpmyadmin|/admin(?:/|$)|/cgi-bin|/etc/passwd|/\\.aws|/\\.svn|/\\.DS_Store)" 1;
  }

  map $query_string $is_attack_qs {
    default 0;
    "~*(?:\\.\\.(?:/|%2f|\\\\|%5c)|%2e%2e(?:/|%2f|\\\\|%5c)|<script|%3cscript|union(?:\\s|%20)+select|(?:\\bor\\b)(?:\\s|%20)+1=1|sleep\\(|benchmark\\(|load_file\\(|into(?:\\s|%20)+outfile)" 1;
  }

  limit_req_zone $binary_remote_addr zone=n50_general_limit:20m rate=900r/m;
  limit_req_zone $binary_remote_addr zone=n50_api_limit:20m rate=360r/m;
  limit_req_zone $binary_remote_addr zone=n50_auth_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=n50_feedback_limit:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=n50_internal_limit:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=n50_conn_limit:10m;

  # Docker embedded DNS
  resolver 127.0.0.11 valid=10s ipv6=off;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  upstream watchlist_upstream {
    zone watchlist_upstream 64k;
    server watchlist:8090 resolve;
  }

  upstream rsi_willr_upstream {
    zone rsi_willr_upstream 64k;
    server rsi-willr-monitor:8091 resolve;
  }

  upstream option_chain_upstream {
    zone option_chain_upstream 64k;
    server option-chain-watcher:18182 resolve;
  }

  upstream matomo_upstream {
    zone matomo_upstream 64k;
    server matomo:80 resolve;
  }

  upstream n50_dashboard_upstream {
    zone n50_dashboard_upstream 64k;
    server n50-dashboard:18184 resolve;
  }

  upstream n50_dashboard_stage_upstream {
    zone n50_dashboard_stage_upstream 64k;
    server n50-dashboard-stage:18184 resolve;
  }

  upstream nse_export_api_upstream {
    zone nse_export_api_upstream 64k;
    server nse-export-api:8091 resolve;
  }

  upstream nse_intraday_api_upstream {
    zone nse_intraday_api_upstream 64k;
    server nse-intraday-api:8092 resolve;
  }

  map $host $n50_public_root_redirect {
    default /n50/;
    stage.nifty50today.co.in /n50-stage/;
    n50test.digii4.co.in /n50-stage/;
    m.nifty50today.co.in /n50/;
    www.m.nifty50today.co.in /n50/;
  }

  map $host $n50_public_health_upstream {
    default http://n50_dashboard_upstream/health;
    stage.nifty50today.co.in http://n50_dashboard_stage_upstream/health;
    n50test.digii4.co.in http://n50_dashboard_stage_upstream/health;
    m.nifty50today.co.in http://n50_dashboard_upstream/health;
    www.m.nifty50today.co.in http://n50_dashboard_upstream/health;
  }

  map $host $n50_public_app_upstream {
    default http://n50_dashboard_upstream;
    stage.nifty50today.co.in http://n50_dashboard_stage_upstream;
    n50test.digii4.co.in http://n50_dashboard_stage_upstream;
    m.nifty50today.co.in http://n50_dashboard_upstream;
    www.m.nifty50today.co.in http://n50_dashboard_upstream;
  }

  server {
    listen 19090;
    server_name m.nifty50today.co.in www.m.nifty50today.co.in stage.nifty50today.co.in n50test.digii4.co.in;
    absolute_redirect off;
    if ($is_invalid_method) { return 405; }
    if ($is_scanner_ua) { return 403; }
    if ($is_probe_uri) { return 444; }
    if ($is_attack_qs) { return 403; }

    limit_conn n50_conn_limit 30;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com https://www.google.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://d.clarity.ms https://h.clarity.ms https://c.bing.com https://dc.services.visualstudio.com https://stats.g.doubleclick.net; frame-src 'self' https://nifty50-2day.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Proxy "";
    proxy_set_header Forwarded "";
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location = / {
      return 302 $n50_public_root_redirect;
    }

    location = /health {
      proxy_pass $n50_public_health_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /n50 {
      return 301 /n50/;
    }

    location = /n50-stage {
      return 301 /n50-stage/;
    }

    location = /matomo {
      return 301 /matomo/;
    }

    location = /matomo/matomo.js {
      proxy_pass http://matomo_upstream/matomo.js;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /matomo/matomo.php {
      proxy_pass http://matomo_upstream/matomo.php;
    }

    # Bare auth/session endpoints remain same-origin for direct callers and operator checks.
    location = /auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    location = /auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    # Prefixed auth endpoints preserve prod and stage origin isolation.
    location = /n50/auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/session/login;
    }

    location = /n50/auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/profile/signup;
    }

    location = /n50-stage/auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/auth/session/login;
    }

    location = /n50-stage/auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/auth/profile/signup;
    }

    # Bare auth and API app routes stay available for same-origin integrations.
    location ^~ /auth/ {
      limit_req zone=n50_api_limit burst=30 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    location = /v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    location = /n50/v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass http://n50_dashboard_upstream/v1/feedback;
    }

    location = /n50-stage/v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/v1/feedback;
    }

    location ^~ /v1/ {
      limit_req zone=n50_api_limit burst=60 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    location = /internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    location = /n50/internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass http://n50_dashboard_upstream/internal/snapshots/refresh;
    }

    location = /n50-stage/internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/internal/snapshots/refresh;
    }

    location ^~ /internal/ {
      limit_req zone=n50_internal_limit burst=4 nodelay;
      proxy_pass $n50_public_app_upstream$request_uri;
    }

    # Same-origin intraday read-model routes terminate at the Python intraday service.
    location ^~ /n50/api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    # Same-origin export and dashboard data routes terminate at the Node export API.
    location ^~ /n50/api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    location ^~ /n50-stage/api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /n50-stage/api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    # Base-path mounted production SPA and BFF/API.
    location ^~ /n50/ {
      proxy_pass http://n50_dashboard_upstream/;
    }

    # Base-path mounted stage SPA and BFF/API.
    location ^~ /n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    # Same-origin Matomo assets and tracking requests stay behind nginx.
    location ^~ /matomo/ {
      rewrite ^/matomo/(.*)$ /$1 break;
      proxy_pass http://matomo_upstream;
      proxy_set_header X-Forwarded-Prefix /matomo;
    }

    # Historical alias path retained for older callers.
    location /api/n50/ {
      proxy_pass http://n50_dashboard_upstream/;
    }

    location /api/n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    # Bare export API routes remain same-origin and cache-friendly.
    location ^~ /api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    # Separate option-chain service stays same-origin under its dedicated path.
    location /option-chain/api/ {
      limit_req zone=n50_general_limit burst=90 nodelay;
      proxy_pass http://option_chain_upstream/api/;
    }

    location = /option-chain/healthz {
      proxy_pass http://option_chain_upstream/healthz;
    }

    location = /option-chain/readyz {
      proxy_pass http://option_chain_upstream/readyz;
    }
  }

  server {
    listen 19090;
    server_name localhost _;
    if ($is_invalid_method) { return 405; }
    if ($is_scanner_ua) { return 403; }
    if ($is_probe_uri) { return 444; }
    if ($is_attack_qs) { return 403; }

    limit_conn n50_conn_limit 30;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com https://www.google.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://d.clarity.ms https://h.clarity.ms https://c.bing.com https://dc.services.visualstudio.com https://stats.g.doubleclick.net; frame-src 'self' https://nifty50-2day.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Proxy "";
    proxy_set_header Forwarded "";
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Gateway UI (Optional Portal)
    location /gateway/ {
      alias /usr/share/nginx/html/;
      index index.html;
    }

    # API Routes
    location /backend/ {
      # Preserve "/backend/*" as-is for watchlist UI/API routes.
      proxy_pass http://watchlist_upstream;
    }

    location = /paper {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /paper/ {
      proxy_pass http://watchlist_upstream;
    }

    location = /watcher {
      proxy_pass http://watchlist_upstream;
    }

    location = /watcher/ {
      return 301 /watcher;
    }

    location ^~ /watcher/ {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /digii4/ {
      proxy_pass http://watchlist_upstream;
    }

    location ^~ /api/digii4/ {
      proxy_pass http://watchlist_upstream;
    }

    location = /n50 {
      return 301 /n50/;
    }

    location = /n50-stage {
      return 301 /n50-stage/;
    }

    location = /matomo {
      return 301 /matomo/;
    }

    location = /matomo/matomo.js {
      proxy_pass http://matomo_upstream/matomo.js;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /matomo/matomo.php {
      proxy_pass http://matomo_upstream/matomo.php;
    }

    # Bare localhost auth/session endpoints remain same-origin for direct callers and operator checks.
    location = /auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/session/login;
    }

    location = /auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/profile/signup;
    }

    location = /n50/auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/session/login;
    }

    location = /n50/auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass http://n50_dashboard_upstream/auth/profile/signup;
    }

    location = /n50-stage/auth/session/login {
      limit_req zone=n50_auth_limit burst=10 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/auth/session/login;
    }

    location = /n50-stage/auth/profile/signup {
      limit_req zone=n50_auth_limit burst=6 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/auth/profile/signup;
    }

    location ^~ /auth/ {
      limit_req zone=n50_api_limit burst=30 nodelay;
      proxy_pass http://n50_dashboard_upstream;
    }

    location = /v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass http://n50_dashboard_upstream/v1/feedback;
    }

    location = /n50/v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass http://n50_dashboard_upstream/v1/feedback;
    }

    location = /n50-stage/v1/feedback {
      limit_req zone=n50_feedback_limit burst=5 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/v1/feedback;
    }

    location ^~ /v1/ {
      limit_req zone=n50_api_limit burst=60 nodelay;
      proxy_pass http://n50_dashboard_upstream;
    }

    location = /internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass http://n50_dashboard_upstream/internal/snapshots/refresh;
    }

    location = /n50/internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass http://n50_dashboard_upstream/internal/snapshots/refresh;
    }

    location = /n50-stage/internal/snapshots/refresh {
      limit_req zone=n50_internal_limit burst=2 nodelay;
      proxy_pass http://n50_dashboard_stage_upstream/internal/snapshots/refresh;
    }

    location ^~ /internal/ {
      limit_req zone=n50_internal_limit burst=4 nodelay;
      proxy_pass http://n50_dashboard_upstream;
    }

    location = /n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    location ^~ /n50/api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /n50/api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    location ^~ /n50/ {
      proxy_pass http://n50_dashboard_upstream/;
    }

    location ^~ /n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    location ^~ /matomo/ {
      rewrite ^/matomo/(.*)$ /$1 break;
      proxy_pass http://matomo_upstream;
      proxy_set_header X-Forwarded-Prefix /matomo;
    }

    location /api/n50/ {
      proxy_pass http://n50_dashboard_upstream/;
    }

    location /api/n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    location ^~ /api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    location = /option-chain {
      return 302 /n50/options;
    }

    location = /option-chain/ {
      return 302 /n50/options;
    }

    location /option-chain/api/ {
      limit_req zone=n50_general_limit burst=90 nodelay;
      proxy_pass http://option_chain_upstream/api/;
    }

    location = /option-chain/healthz {
      proxy_pass http://option_chain_upstream/healthz;
    }

    location = /option-chain/readyz {
      proxy_pass http://option_chain_upstream/readyz;
    }

    location /rsi-willr/ {
      proxy_pass http://rsi_willr_upstream/;
    }

    location = / {
      return 302 /n50/;
    }

    location / {
      return 302 /n50/;
    }
  }
}
