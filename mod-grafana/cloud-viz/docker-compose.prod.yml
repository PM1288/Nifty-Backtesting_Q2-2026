services:
  proxy:
    image: nginx:alpine
    container_name: qio-cloud-viz-proxy
    restart: unless-stopped
    ports:
    - 3009:80
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - qio-cloud-viz
    - qio-configurator
    networks:
    - edge-net
    cpus: '0.20'
    mem_limit: 256m
    logging: &id001
      driver: json-file
      options:
        max-size: 128m
        max-file: '30'
    tmpfs:
    - /tmp:size=64m
  qio-cloud-viz:
    image: qiotech/qio-cloud-viz:${QIO_CLOUD_VIZ_TAG:-latest}
    container_name: qio-cloud-viz
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-t2.qio.co.in}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://t2.qio.co.in/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://qio-cloud-viz:3000/
      GF_LIVE_ALLOWED_ORIGINS: '*'
      GF_ANALYTICS_GOOGLE_ANALYTICS_4_ID: ${GA4_ID:-G-4C2B5M6KLR}
      GF_ANALYTICS_GOOGLE_ANALYTICS_4_SEND_MANUAL_PAGE_VIEWS: 'true'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      grafana-renderer:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
    - grafana_data:/var/lib/grafana
    networks:
    - edge-net
    cpus: '1.0'
    mem_limit: 1g
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  qio-configurator:
    image: qiotech/qio-configurator:${QIO_CONFIGURATOR_TAG:-latest}
    container_name: qio-cloud-viz-configurator
    restart: unless-stopped
    environment:
      ROOT_PATH: /config
      LOG_LEVEL: ${CONFIGURATOR_LOG_LEVEL:-INFO}
      GRAFANA_URL: http://qio-cloud-viz:3000
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      ALERTMANAGER_URL: http://alertmanager:9093
      PROMTAIL_URL: http://promtail:9080
      CONFIG_ROOT: /config
    depends_on:
      qio-cloud-viz:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      promtail:
        condition: service_healthy
    volumes:
    - ./prometheus:/config/prometheus:rw
    - ./alertmanager:/config/alertmanager:rw
    - ./promtail:/config/promtail:rw
    - configurator_logs:/var/log/qio-configurator
    ports:
    - ${CONFIGURATOR_PORT:-3010}:8080
    networks:
    - edge-net
    cpus: '0.20'
    mem_limit: 256m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  postgres:
    image: postgres:15-alpine
    container_name: qio-cloud-viz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - edge-net
    cpus: '1.0'
    mem_limit: 1g
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: qio-cloud-viz-renderer
    restart: unless-stopped
    networks:
    - edge-net
    cpus: '0.50'
    mem_limit: 512m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: qio-cloud-viz-prometheus
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    - --enable-feature=remote-write-receiver
    - --web.enable-lifecycle
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./prometheus/targets:/etc/prometheus/targets:ro
    - ./prometheus/rules:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    networks:
    - edge-net
    cpus: '1.0'
    mem_limit: 1g
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  loki:
    image: grafana/loki:2.9.8
    container_name: qio-cloud-viz-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - ./loki/config.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
    networks:
    - edge-net
    cpus: '1.0'
    mem_limit: 1g
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  tempo:
    image: grafana/tempo:2.6.1
    container_name: qio-cloud-viz-tempo
    restart: unless-stopped
    command:
    - -config.file=/etc/tempo/config.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3200/ready >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - ./tempo/config.yml:/etc/tempo/config.yml:ro
    - tempo_data:/var/tempo
    networks:
    - edge-net
    cpus: '1.0'
    mem_limit: 1g
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: qio-cloud-viz-alertmanager
    restart: unless-stopped
    command:
    - --config.file=/etc/alertmanager/config.yml
    - --storage.path=/alertmanager
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9093/-/ready >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    - alertmanager_data:/alertmanager
    networks:
    - edge-net
    cpus: '0.20'
    mem_limit: 256m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  promtail:
    image: grafana/promtail:2.9.8
    container_name: qio-cloud-viz-promtail
    restart: unless-stopped
    command:
    - -config.file=/etc/promtail/config.yml
    - -config.expand-env=true
    - -server.enable-runtime-reload=true
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -lc ''exec 3<>/dev/tcp/127.0.0.1/9080; printf "GET /ready HTTP/1.1\r\nHost:
        localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q "200"'''
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
    - ${PROMTAIL_SYSLOG_PORT:-1514}:1514/tcp
    - ${PROMTAIL_SYSLOG_PORT:-1514}:1514/udp
    volumes:
    - ./promtail/config.yml:/etc/promtail/config.yml:ro
    - promtail_positions:/positions
    networks:
    - edge-net
    cpus: '0.50'
    mem_limit: 512m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  alloy:
    image: grafana/alloy:v1.12.1
    container_name: qio-cloud-viz-alloy
    restart: unless-stopped
    command:
    - run
    - --stability.level=public-preview
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.alloy
    environment:
      TENANT_ID: ${TENANT_ID:-}
      SITE_ID: ${SITE_ID:-}
      ENV: ${ENV:-}
      LOKI_PUSH_URL: ${ALLOY_LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
      PROM_REMOTE_WRITE_URL: ${ALLOY_PROM_REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
      TEMPO_OTLPHTTP_URL: ${ALLOY_TEMPO_OTLPHTTP_URL:-http://tempo:4318}
      ALLOY_LOKI_WAL_ENABLED: ${ALLOY_LOKI_WAL_ENABLED:-true}
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -lc ''exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET / HTTP/1.1\r\nHost:
        localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q "200"'''
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - alloy_data:/var/lib/alloy
    ports:
    - ${ALLOY_UI_PORT:-3011}:12345
    - ${ALLOY_OTLP_GRPC_PORT:-4317}:4317
    - ${ALLOY_OTLP_HTTP_PORT:-4318}:4318
    networks:
    - edge-net
    cpus: '0.50'
    mem_limit: 512m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: qio-cloud-viz-node-exporter
    restart: unless-stopped
    profiles:
    - exporters
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    networks:
    - edge-net
    cpus: '0.20'
    mem_limit: 256m
    logging: *id001
    tmpfs:
    - /tmp:size=32m
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: qio-cloud-viz-cadvisor
    restart: unless-stopped
    profiles:
    - exporters
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    networks:
    - edge-net
    cpus: '0.20'
    mem_limit: 256m
    logging: *id001
    tmpfs:
    - /tmp:size=64m
networks:
  edge-net: null
volumes:
  grafana_data:
    driver_opts:
      size: 100G
  postgres_data:
    driver_opts:
      size: 100G
  prometheus_data:
    driver_opts:
      size: 100G
  loki_data:
    driver_opts:
      size: 100G
  tempo_data:
    driver_opts:
      size: 100G
  alertmanager_data:
    driver_opts:
      size: 100G
  promtail_positions:
    driver_opts:
      size: 100G
  configurator_logs:
    driver_opts:
      size: 100G
  alloy_data:
    driver_opts:
      size: 100G
