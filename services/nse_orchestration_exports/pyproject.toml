[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-orchestration-exports"
version = "0.1.0"
description = "Scheduled refresh orchestration and export APIs for the NSE learning platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "psycopg[binary]==3.2.6",
  "psycopg-pool==3.2.6",
  "pydantic==2.8.2",
  "apscheduler==3.10.4",
  "python-dotenv==1.0.1",
  "orjson==3.10.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
