  dynamic_greeks_shortlist_size: 20
  local_greek_risk_free_rate: 0.06
rest_tasks:
  enable_quote_snapshots: true
  quote_snapshot_interval_seconds: 60
  quote_snapshot_include_options: false
  quote_snapshot_primary_kinds: ["EQUITY","INDEX"]
  quote_snapshot_primary_indices: ["NIFTY50","BANKNIFTY"]
  quote_snapshot_rotation_max_tokens: 200
  quote_snapshot_rotation_budgets:
    - kind: "INDEX"
      max_tokens: 20
    - kind: "FUT"
      max_tokens: 80
    - kind: "OPTSTK_REST"
      max_tokens: 380
    - kind: "OPTIDX"
      max_tokens: 60
    - kind: "OPTSTK"
      max_tokens: 60
  enable_option_quote_snapshots: true
