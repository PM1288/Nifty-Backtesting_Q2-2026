name: Engineering checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-stock-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neon-stock-terminal/package-lock.json
      - run: npm ci --no-fund
      - run: npm run prisma:generate --workspace=@app/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go test -race ./cmd/... ./internal/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./cmd/... ./internal/...
      - run: bash scripts/verify/canonical-repository-gate.sh
