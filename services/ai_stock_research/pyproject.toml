[project]
name = "ai-stock-research"
version = "1.1.2"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.9",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.7"]

[project.scripts]
ai-stock-research = "ai_stock_research.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
