[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-fii-reports-service"
version = "0.1.0"
description = "Single-service NSE FII daily latest-pull and history-backfill API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "xlrd>=2.0,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0"]

[project.scripts]
nse-fii-reports = "nse_fii_services.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
