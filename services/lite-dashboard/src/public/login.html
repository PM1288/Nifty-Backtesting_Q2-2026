<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compact Watchlist Sign In</title>
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --green: #00ff66;
      --red: #ff0033;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.62);
      --dim: rgba(255, 255, 255, 0.42);
      --glow-green: 0 0 24px rgba(0, 255, 102, 0.18);
      --glow-red: 0 0 24px rgba(255, 0, 51, 0.16);
      --glow-white: 0 0 24px rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(0, 255, 102, 0.12), transparent 22%),
        radial-gradient(circle at 85% 0%, rgba(255, 0, 51, 0.1), transparent 22%),
        linear-gradient(180deg, #050505 0%, var(--black) 100%);
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 16px;
      position: relative;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 3px, 3px 100%;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.32), transparent 90%);
      opacity: 0.28;
    }
    .card {
      width: 100%;
      max-width: 390px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025));
      border-radius: 22px;
      padding: 22px 20px 20px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(14px);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(0, 255, 102, 0.08), transparent 38%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent 62%);
      pointer-events: none;
    }
    .card > * {
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      letter-spacing: -0.05em;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.6;
    }
    label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: "IBM Plex Mono", Consolas, monospace;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--text);
      padding: 12px 14px;
      margin-bottom: 14px;
      font: inherit;
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }
    input:focus {
      outline: none;
      border-color: rgba(0, 255, 102, 0.42);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: var(--glow-green);
    }
    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(0, 255, 102, 0.36);
      background: linear-gradient(180deg, rgba(0, 255, 102, 0.12), rgba(255, 255, 255, 0.02));
      color: var(--text);
      padding: 0 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: Inter, "Segoe UI", sans-serif;
      transition: transform 140ms ease, border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }
    button:hover {
      border-color: var(--green);
      box-shadow: var(--glow-green);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
    #error {
      color: var(--red);
      font-size: 0.76rem;
      min-height: 20px;
      margin-bottom: 10px;
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compact Watchlist</h1>
    <p>Sign in to open the compact live board and the lighter mobile watchlist views.</p>
    <div id="error"></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" value="admin" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="admin1234" required />
      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const formData = new FormData(form);
      const payload = {
        username: formData.get('username'),
        password: formData.get('password'),
      };

      const res = await fetch('./auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.ok) {
        error.textContent = body.error || 'Login failed';
        return;
      }
      window.location.href = './';
    });
  </script>
</body>
</html>
