events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream option_chain_upstream {
    zone option_chain_upstream 64k;
    server option-chain-watcher:18182 resolve;
  }

  upstream n50_dashboard_stage_upstream {
    zone n50_dashboard_stage_upstream 64k;
    server n50-dashboard-stage:18184 resolve;
  }

  upstream nse_export_api_upstream {
    zone nse_export_api_upstream 64k;
    server nse-export-api:8091 resolve;
  }

  upstream nse_intraday_api_upstream {
    zone nse_intraday_api_upstream 64k;
    server nse-intraday-api:8092 resolve;
  }

  server {
    listen 19090;
    server_name localhost _;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    location = / {
      return 302 /n50-stage/;
    }

    location = /n50-stage {
      return 301 /n50-stage/;
    }

    location = /n50 {
      return 302 /n50-stage/;
    }

    location = /option-chain {
      return 302 /n50-stage/options;
    }

    location = /option-chain/ {
      return 302 /n50-stage/options;
    }

    location = /auth/session/login {
      proxy_pass http://n50_dashboard_stage_upstream/auth/session/login;
    }

    location = /auth/profile/signup {
      proxy_pass http://n50_dashboard_stage_upstream/auth/profile/signup;
    }

    location ^~ /auth/ {
      proxy_pass http://n50_dashboard_stage_upstream;
    }

    location = /v1/feedback {
      proxy_pass http://n50_dashboard_stage_upstream/v1/feedback;
    }

    location ^~ /v1/ {
      proxy_pass http://n50_dashboard_stage_upstream;
    }

    location = /internal/snapshots/refresh {
      proxy_pass http://n50_dashboard_stage_upstream/internal/snapshots/refresh;
    }

    location ^~ /internal/ {
      proxy_pass http://n50_dashboard_stage_upstream;
    }

    location ^~ /n50-stage/api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /n50-stage/api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    location ^~ /api/v1/intraday/ {
      proxy_pass http://nse_intraday_api_upstream/api/v1/intraday/;
    }

    location ^~ /api/v1/ {
      proxy_pass http://nse_export_api_upstream/api/v1/;
    }

    location ^~ /api/n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    location = /n50-stage/v1/feedback {
      proxy_pass http://n50_dashboard_stage_upstream/v1/feedback;
    }

    location = /n50-stage/internal/snapshots/refresh {
      proxy_pass http://n50_dashboard_stage_upstream/internal/snapshots/refresh;
    }

    location ^~ /n50-stage/ {
      proxy_pass http://n50_dashboard_stage_upstream/;
    }

    location ^~ /option-chain/api/ {
      proxy_pass http://option_chain_upstream/api/;
    }

    location = /option-chain/healthz {
      proxy_pass http://option_chain_upstream/healthz;
    }

    location = /option-chain/readyz {
      proxy_pass http://option_chain_upstream/readyz;
    }
  }
}
