strategy_id: daily_rising_oversold_intraday
strategy_version_id: daily_rising_oversold_intraday_v1
display_name: Daily Rising Oversold + Intraday Pullback
version: 1
archetype: multi_timeframe_mean_reversion
plugin: nifty_stratlab.strategies.reference_equity:DailyRisingOversoldIntradayStrategy
supported_intervals: [1m]
required_features: [rsi_14, willr_14, bollinger_lower_20_2, setup_rsi, setup_rsi_prev1, setup_rsi_prev2, setup_close]
parameters:
  daily_rsi_below: 30
  minute_rsi_below: 25
  minute_willr_below: -80
  minute_rsi_above: 70
  entry_start: "09:30:00"
  entry_end: "12:00:00"
  target_exit_pct: 1.25
assumptions:
  daily_setup: "previous completed day RSI(14) < 30 and greater than the two preceding daily RSI values"
  opening_gap: "current session open must be above previous completed session close"
  intraday_entry: "completed 1-minute bar RSI(14) < 25, WILLR(14) < -80, and low above lower Bollinger(20,2)"
  execution: next_1m_bar_open
  exit: "existing target/exit policy; RSI > 70 exit remains enabled"
  timezone: Asia/Kolkata
  target_exit_pct: 1.25
  order_authority: false
owner: backtest-core
status: reference
entry_timing: next_bar_open
