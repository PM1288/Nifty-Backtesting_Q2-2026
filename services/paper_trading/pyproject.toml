[project]
name = "papertrade"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "starlette==1.3.1",
  "structlog==25.4.0",
  "typer==0.16.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "hypothesis==6.138.2",
  "jsonschema==4.25.1",
  "mypy==1.17.1",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.8",
]

[project.scripts]
papertrade = "papertrade.cli:app"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_return_any = false
no_implicit_optional = false
plugins = ["pydantic.mypy"]

[tool.coverage.run]
omit = ["src/papertrade/cli.py", "src/papertrade/__main__.py"]
